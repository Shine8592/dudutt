name: CI

on:
  push:
    branches: [main]
    # 只在影响代码/测试的改动上触发，避免改个 README 就跑全套
    paths:
      - "dudutt/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支只保留最新一次运行，取消排队中的旧运行（防止连续推送刷屏）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # 本项目有 pyproject.toml，cache: pip 可正常推导缓存键
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run signature & client tests
        run: python tests/test_pop_client.py

      - name: Run action & guardrail tests
        run: python tests/test_actions.py

      - name: Run MCP end-to-end smoke test
        # 不需要凭据：内部使用 mock 后端
        run: python tests/test_e2e_mcp.py
        env:
          DUDUTT_BACKEND: mock
          PYTHONUTF8: "1"

      - name: Verify import & CLI entry point
        run: python -c "import dudutt, dudutt.server, dudutt.actions; print('import OK')"

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
